<svg viewBox="0 0 1200 630" width="1200" height="630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark terminal background -->
  <rect width="1200" height="630" fill="#0F1A15"/>

  <!-- Subtle radial glow behind diamond -->
  <defs>
    <radialGradient id="og-glow" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#3FB68B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Scanline overlay for CRT terminal effect -->
  <defs>
    <pattern id="scanlines" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="#000000" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- ASCII art diamond (wider equator band, 17 lines) -->
  <g style="font-family:'IBM 3270','IBM 3270 Narrow',monospace;font-size:16px;fill:#3FB68B;fill-opacity:0.5" text-anchor="middle">
    <text x="600" y="80">/\</text>
    <text x="600" y="100">/  \</text>
    <text x="600" y="120">/ :: \</text>
    <text x="600" y="140">/ :::: \</text>
    <text x="600" y="160">/ :::::: \</text>
    <text x="600" y="180">/ :::::::: \</text>
    <text x="600" y="200">/ :::::::::: \</text>
    <text x="600" y="220">/==============\</text>
    <text x="600" y="240">|==============|</text>
    <text x="600" y="260">\==============/</text>
    <text x="600" y="280">\ %%%%%%%%%% /</text>
    <text x="600" y="300">\ %%%%%%%% /</text>
    <text x="600" y="320">\ %%%%%% /</text>
    <text x="600" y="340">\ %%%% /</text>
    <text x="600" y="360">\ %% /</text>
    <text x="600" y="380">\  /</text>
    <text x="600" y="400">\/</text>
  </g>

  <!-- Diamond prism mark (8-face clean variant, overlaid on ASCII art) -->
  <g transform="translate(600, 240) scale(1.6) translate(-40, -50)">
    <polygon points="40,2 70,50 40,98 10,50" fill="#0D3D2E" opacity="0.9"/>
    <polygon points="40,2 15,42 40,42" fill="#4FD4A4" opacity="0.9"/>
    <polygon points="40,2 65,42 40,42" fill="#1A6B50" opacity="0.9"/>
    <polygon points="15,42 10,50 40,50 40,42" fill="#3FB68B" opacity="0.9"/>
    <polygon points="65,42 70,50 40,50 40,42" fill="#0D3D2E" opacity="0.9"/>
    <polygon points="10,50 15,58 40,58 40,50" fill="#3FB68B" opacity="0.9"/>
    <polygon points="70,50 65,58 40,58 40,50" fill="#1A6B50" opacity="0.9"/>
    <polygon points="15,58 40,98 40,58" fill="#4FD4A4" opacity="0.9"/>
    <polygon points="65,58 40,98 40,58" fill="#2E9E76" opacity="0.9"/>
  </g>

  <!-- "ecns" wordmark (large, path outlines, centered at x=600 y=477) -->
  <g transform="translate(215, 360)">
    <path
       d="m 121.496,55.064 v 4.424 l 2.408,2.52 h 14.728 v 3.136 h -15.4 q -0.672,0 -1.12,-0.448 l -3.472,-3.36 q -0.448,-0.448 -0.448,-1.176 V 46.608 q 0,-0.56 0.56,-1.12 l 3.416,-3.528 q 0.616,-0.616 1.232,-0.616 h 10.136 q 0.56,0 1.176,0.616 l 3.304,3.472 q 0.504,0.504 0.504,1.12 v 8.512 z m 0.056,-3.472 h 13.72 v -4.368 l -2.408,-2.464 h -8.848 l -2.464,2.52 z M 169.99205,41.4 v 3.304 h -11.368 l -5.768,5.824 v 5.544 l 5.936,5.824 h 11.2 v 3.248 h -11.872 q -0.728,0 -1.176,-0.448 l -6.888,-6.776 q -0.504,-0.504 -0.504,-1.176 v -6.888 q 0,-0.672 0.504,-1.176 l 6.72,-6.776 q 0.504,-0.504 1.12,-0.504 z m 16.96805,1.848 1.344,-1.344 q 0.504,-0.504 1.176,-0.504 h 6.944 q 0.672,0 1.12,0.448 l 3.304,3.248 q 0.504,0.504 0.504,1.176 v 18.872 h -3.192 v -18.2 l -2.408,-2.184 h -5.6 l -2.352,2.352 V 65.2 h -3.36 V 46.44 q 0,-0.112 0.224,-0.672 l -1.008,-1.12 h -2.744 v -3.304 h 3.528 q 0.672,0 1.064,0.504 z m 42.22405,3.92 -2.464,-2.464 h -8.624 l -1.624,1.68 15.624,12.376 q 0.616,0.532 0.616,1.232 0,0.784 -0.504,1.288 l -3.528,3.472 q -0.504,0.504 -1.176,0.504 h -10.08 q -0.672,0 -1.176,-0.504 l -3.472,-3.36 q -0.504,-0.504 -0.504,-1.232 v -1.568 h 3.36 v 0.84 l 2.464,2.464 h 8.736 l 1.68,-1.68 -15.568,-12.32 q -0.532,-0.364 -0.616,-1.232 v -0.196 q 0,-0.644 0.448,-1.092 l 3.36,-3.528 q 0.504,-0.504 1.232,-0.504 h 10.024 q 0.672,0 1.176,0.504 l 3.472,3.416 q 0.504,0.504 0.504,1.176 v 1.792 h -3.36 z"
       style="fill:#3FB68B" transform="scale(2.2)" aria-label="ecns" />
  </g>

  <!-- Terminal prompt tagline -->
  <text x="600" y="536" text-anchor="middle"
    style="font-family:'IBM 3270','IBM 3270 Narrow',monospace;font-size:22px;fill:#3FB68B;fill-opacity:0.65">&gt; register yourname.etc</text>

  <!-- Domain URL at bottom -->
  <text x="600" y="588" text-anchor="middle"
    style="font-family:'IBM 3270','IBM 3270 Narrow',monospace;font-size:16px;fill:#3FB68B;fill-opacity:0.35;letter-spacing:0.08em">ecns.domains</text>

  <!-- Bottom accent line -->
  <rect x="0" y="625" width="1200" height="5" fill="#3FB68B" opacity="0.15"/>
</svg>
