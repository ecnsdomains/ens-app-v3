<svg viewBox="0 0 180 180" width="180" height="180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Apple Touch Icon (light): ETC Diamond Prism on off-white background -->
  <rect width="180" height="180" rx="24" fill="#F5F5F0"/>
  <!-- Centered diamond, scaled to fit with padding -->
  <g transform="translate(90, 90) scale(0.8) translate(-40, -50)">
    <polygon points="40,2 70,50 40,98 10,50" fill="#0D3D2E"/>
