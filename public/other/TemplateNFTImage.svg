<svg width="270" height="270" viewBox="0 0 270 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: 'IBM 3270', 'IBM 3270 Narrow', 'Courier New', monospace;
        font-style: normal;
        font-variant-numeric: tabular-nums;
        font-weight: normal;
        font-variant-ligatures: none;
        line-height: 34px;
      }
    </style>
    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="270" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="270" height="2" fill="rgba(0,0,0,0)" />
      <rect x="0" y="2" width="270" height="2" fill="rgba(0,0,0,0.08)" />
    </pattern>
    <!-- Phosphor glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
    </radialGradient>
  </defs>

  <!-- Background: Terminal Black -->
  <rect width="270" height="270" fill="#0F1A15" />

  <!-- Scanline overlay -->
  <rect width="270" height="270" fill="url(#scanlines)" />

  <!-- Diamond Prism Mark (centered, scale ~0.8x from 80x100 viewBox) -->
  <g transform="translate(103, 60) scale(0.8)" filter="url(#glow)">
    <!-- 8-face diamond prism: tall rhombus, equator band y=42-58 -->
    <!-- Left bright faces -->
    <path d="M40 2 L10 50 L40 42 Z" fill="#4FD4A4" />
    <path d="M40 42 L10 50 L40 58 Z" fill="#3FB68B" />
    <path d="M40 58 L10 50 L40 98 Z" fill="#2E9E76" />
    <!-- Right dark faces -->
    <path d="M40 2 L70 50 L40 42 Z" fill="#2E9E76" />
    <path d="M40 42 L70 50 L40 58 Z" fill="#1A6B50" />
    <path d="M40 58 L70 50 L40 98 Z" fill="#0D3D2E" />
    <!-- Top cap highlight -->
    <path d="M40 2 L40 42 L10 50 Z" fill="#4FD4A4" opacity="0.15" />
    <!-- Bottom cap shadow -->
    <path d="M40 98 L40 58 L70 50 Z" fill="#0D3D2E" opacity="0.3" />
  </g>

  <!-- Vignette overlay -->
  <rect width="270" height="270" fill="url(#vignette)" />

  <!-- Terminal border -->
  <rect x="8" y="8" width="254" height="254" rx="2" ry="2"
    fill="none" stroke="#3FB68B" stroke-width="0.5" opacity="0.25" />

  <!-- Name placeholder text area -->
  <text x="135" y="200" text-anchor="middle" fill="#3FB68B" font-size="18" opacity="0.9">
    name.etc
  </text>

  <!-- Subtle prompt prefix -->
  <text x="135" y="230" text-anchor="middle" fill="#3FB68B" font-size="11" opacity="0.4">
    ECNS // Ethereum Classic Name Service
  </text>
</svg>
