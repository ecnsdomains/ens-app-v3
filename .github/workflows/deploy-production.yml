name: Deploy to Production

on:
  push:
    branches:
      - etc

# Only allow one production deployment at a time
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://app.ecns.domains

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm lint:types

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_CHAIN_NAME: etc
          NEXT_PUBLIC_PROVIDER: https://etc.rivet.link
          NEXT_PUBLIC_DOMAIN: ecns.domains

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Comment deployment URL
        if: github.event_name == 'push'
        run: |
          echo "🚀 Deployed to production: https://app.ecns.domains"
          echo "📊 Vercel URL: ${{ steps.vercel-deploy.outputs.preview-url }}"

  post-deploy-checks:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5

    steps:
      - name: Wait for deployment to be ready
        run: sleep 30

      - name: Check production health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://app.ecns.domains)
          if [ "$response" != "200" ]; then
            echo "❌ Health check failed with status: $response"
            exit 1
          fi
          echo "✅ Production health check passed"

      - name: Check OG image endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://app.ecns.domains/api/og)
          if [ "$response" != "200" ]; then
            echo "❌ OG image endpoint failed with status: $response"
            exit 1
          fi
          echo "✅ OG image endpoint health check passed"

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "🌐 Live at: https://app.ecns.domains"
